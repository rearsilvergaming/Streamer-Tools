<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexus Command Check-Ins</title>

    <style>
      :root {
        --text: #f7f2e8;
        --muted: rgba(247, 242, 232, 0.68);
        --cyan: #42e8ff;
        --gold: #f0be65;
        --green: #75f0a8;
        --panel: rgba(7, 12, 18, 0.78);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 430px;
        height: 120px;
        overflow: hidden;
        background: transparent;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        color: var(--text);
      }

      body {
        pointer-events: none;
      }

      .stage {
        width: 430px;
        height: 120px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
      }

      .icon-wrap {
        position: relative;
        flex: 0 0 auto;
        width: 102px;
        height: 102px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(
          circle,
          rgba(66, 232, 255, 0.16),
          rgba(5, 10, 16, 0.88)
        );
        border: 2px solid rgba(66, 232, 255, 0.82);
        box-shadow:
          0 0 18px rgba(66, 232, 255, 0.3),
          inset 0 0 18px rgba(66, 232, 255, 0.1);
      }

      .icon-wrap::after {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .icon {
        color: var(--cyan);
        font-size: 38px;
        line-height: 1;
        font-weight: 900;
        transform: translateY(-1px);
      }

      .stack {
        flex: 1 1 auto;
        min-width: 0;
        height: 106px;
        display: grid;
        grid-template-rows: 26px 48px 26px;
        gap: 3px;
      }

      .strip {
        position: relative;
        min-width: 0;
        overflow: hidden;
        padding: 5px 10px;
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(66, 232, 255, 0.07), transparent 42%),
          var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow:
          inset 3px 0 0 rgba(66, 232, 255, 0.72),
          0 4px 12px rgba(0, 0, 0, 0.18);
      }

      .header-strip {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 7px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .header-title {
        color: var(--text);
        font-size: 13px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .latest-strip {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .record-label {
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 7px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .latest-line {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
      }

      .latest-location {
        min-width: 0;
        max-width: 165px;
        color: var(--cyan);
        font-size: 16px;
        line-height: 1;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .latest-user {
        min-width: 0;
        color: var(--gold);
        font-size: 9px;
        line-height: 1;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stats-strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .command {
        min-width: 0;
        color: var(--text);
        font-size: 8px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .counts {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 7px;
        line-height: 1;
        font-weight: 900;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .counts b {
        color: var(--gold);
        font-size: 9px;
      }

      .flash .icon-wrap,
      .flash .latest-strip,
      .flash .stats-strip {
        animation: data-in 0.45s ease-out;
      }

      @keyframes data-in {
        from {
          opacity: 0;
          transform: translateX(-10px);
          filter: blur(2px) brightness(1.4);
        }

        to {
          opacity: 1;
          transform: translateX(0);
          filter: blur(0) brightness(1);
        }
      }
    </style>
  </head>

  <body>
    <div id="stage" class="stage">
      <div class="icon-wrap">
        <div class="icon">⌖</div>
      </div>

      <div class="stack">
        <div class="strip header-strip">
          <span class="eyebrow">Nexus Command</span>
          <span class="header-title">Check-In Data</span>
        </div>

        <div class="strip latest-strip">
          <div class="record-label">Latest Signal</div>

          <div class="latest-line">
            <span id="latestLocation" class="latest-location"
              >Awaiting Data</span
            >
            <span id="latestUser" class="latest-user">Standing by</span>
          </div>
        </div>

        <div class="strip stats-strip">
          <span class="command">Use !checkin &lt;location&gt;</span>

          <div class="counts">
            <span><b id="totalCheckins">0</b> CHECK-INS</span>
            <span><b id="totalLocations">0</b> LOCATIONS</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      function parseURL() {
        const url = new URL(document.URL);

        return {
          wsUri:
            url.searchParams.get("ws_uri") !== null
              ? decodeURI(url.searchParams.get("ws_uri"))
              : "ws://127.0.0.1:8080/",
        };
      }

      const config = parseURL();

      const stage = document.getElementById("stage");
      const latestLocation = document.getElementById("latestLocation");
      const latestUser = document.getElementById("latestUser");
      const totalCheckins = document.getElementById("totalCheckins");
      const totalLocations = document.getElementById("totalLocations");

      let socket = null;

      function safeText(value, fallback = "") {
        if (value === undefined || value === null || value === "") {
          return fallback;
        }

        return String(value);
      }

      function updateNexusCheckins(data) {
        if (!data) {
          return;
        }

        totalCheckins.innerText = String(Number(data.totalCheckins || 0));
        totalLocations.innerText = String(Number(data.totalLocations || 0));

        const recentHistory = Array.isArray(data.recentHistory)
          ? data.recentHistory
          : [];

        const latestRecentCheckin = recentHistory
          .filter(
            (item) =>
              String(item.action || "checkin").toLowerCase() === "checkin",
          )
          .reverse()[0];

        if (latestRecentCheckin) {
          latestLocation.innerText = safeText(
            latestRecentCheckin.displayLocation,
            "Unknown location",
          );

          latestUser.innerText = safeText(
            latestRecentCheckin.username,
            "Viewer",
          );
        } else {
          latestLocation.innerText = "Awaiting Data";
          latestUser.innerText = "Standing by";
        }

        stage.classList.remove("flash");
        void stage.offsetWidth;
        stage.classList.add("flash");
      }

      function handleStreamerBotEvent(wsdata) {
        const isWrappedCustomEvent =
          wsdata.event?.source === "General" &&
          wsdata.event?.type === "Custom" &&
          typeof wsdata.data?.data === "string";

        if (!isWrappedCustomEvent) {
          return;
        }

        let innerMessage = null;

        try {
          innerMessage = JSON.parse(wsdata.data.data);
        } catch {
          return;
        }

        if (innerMessage.data?.name === "NexusCheckinsUpdated") {
          updateNexusCheckins(innerMessage.data.payload);
        }
      }

      function connectws() {
        socket = new WebSocket(config.wsUri);

        socket.onopen = () => {
          socket.send(
            JSON.stringify({
              request: "Subscribe",
              id: "nexus-checkin-widget",
              events: {
                General: ["Custom"],
              },
            }),
          );
        };

        socket.onmessage = (event) => {
          let wsdata = null;

          try {
            wsdata = JSON.parse(event.data);
          } catch {
            return;
          }

          handleStreamerBotEvent(wsdata);
        };

        socket.onclose = () => {
          setTimeout(connectws, 5000);
        };
      }

      connectws();
    </script>
  </body>
</html>
